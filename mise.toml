monorepo_root = true
min_version = "2026.8.5"

[monorepo]
config_roots = []

[tools]
python = "3.14.7"
uv = "0.9.3"
gcloud = "580.0.0"
actionlint = "1.7.12"
xcodegen = "2.46.0"

[settings]
experimental = true

[tasks.setup]
description = "Install dependencies and create a migrated, seeded local PostgreSQL"
run = "scripts/local/setup.sh"

[tasks.up]
description = "Start local PostgreSQL and the Django development server"
run = "scripts/local/up.sh"

[tasks.down]
description = "Stop local PostgreSQL without deleting its data"
run = "scripts/local/compose.sh stop postgres"

[tasks."db:reset"]
description = "Recreate, migrate, and seed only the local PostgreSQL volume"
run = "scripts/local/reset-database.sh"

[tasks."lint:server"]
description = "Lint server, scripts, and data tests"
run = "uv run ruff check server scripts tests"

[tasks."typecheck:server"]
description = "Run the Django-aware server type check"
run = "uv run mypy"

[tasks."test:server"]
description = "Run server tests against disposable local PostgreSQL"
run = "scripts/local/test-server.sh"

[tasks."check:migrations"]
description = "Check for missing migrations and classify migration risk"
run = "scripts/ci/migrations.sh"

[tasks."api:export"]
description = "Regenerate the checked-in OpenAPI contract"
run = "uv run python server/manage.py export_client_openapi --settings=config.settings.test --output api/openapi.json"

[tasks."fixtures:export"]
description = "Regenerate the checked-in canonical API fixtures"
run = "scripts/ci/fixtures.sh --write"

[tasks."model:evaluate"]
description = "Run the complete historical cover evaluation and write a receipt"
run = "uv run python scripts/data/evaluate_cover_release.py --code-revision=${CODE_REVISION:-local-evaluation} --output=.artifacts/model/evaluation.json"

[tasks.preview]
description = "Dispatch the optional shared-preview workflow for the current branch"
run = "scripts/local/dispatch-preview.sh"

[tasks.doctor]
description = "Diagnose local tools and PostgreSQL without touching providers"
run = "scripts/local/doctor.sh"

[tasks."ios:build"]
description = "Build the selected local iOS scheme"
run = "ios/scripts/build.sh"

[tasks."ios:test"]
description = "Run the selected iOS test plan on the exact simulator UDID"
run = "ios/scripts/test.sh"

[tasks."ios:boot"]
description = "Boot the dedicated simulator by ILLINICOVER_SIMULATOR_UDID"
run = "ios/scripts/boot.sh"

[tasks."ios:reset-app"]
description = "Reset IlliniCover.dev state without erasing the simulator"
run = "ios/scripts/reset-app.sh"

[tasks."ios:screenshot"]
description = "Capture the exact simulator framebuffer: mise run ios:screenshot -- NAME"
run = "ios/scripts/screenshot.sh"
