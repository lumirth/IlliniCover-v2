[project]
name = "illinicover-v2"
version = "0.1.0"
description = "IlliniCover v2 Django monolith"
requires-python = "==3.14.*"
dependencies = [
  "django==5.2.17",
  "django-allauth[headless,mfa]==65.19.0",
  "django-ninja==1.6.2",
  "gunicorn==23.0.0",
  "psycopg[binary]==3.3.4",
  "sentry-sdk[django]==2.48.0",
  "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
  "django-stubs[compatible-mypy]==6.0.7",
  "pytest==9.0.2",
  "pytest-django==4.11.1",
  "pyyaml==6.0.3",
  "ruff==0.15.7",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["server"]
python_files = ["test_*.py"]
testpaths = ["server"]
addopts = "-ra"

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
python_version = "3.14"
mypy_path = ["server"]
files = ["server", "scripts"]
exclude = ["server/.*/migrations/", "server/.*/tests/"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[[tool.mypy.overrides]]
module = ["allauth.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py314"
line-length = 100
exclude = ["server/**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
"server/config/settings/*.py" = ["F403", "F405"]
"server/**/tests/*.py" = ["S101"]
"server/**/models.py" = ["DJ008"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server"]
