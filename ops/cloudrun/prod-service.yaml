apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: illinicover-api
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "3"
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/startup-cpu-boost: "false"
    spec:
      containerConcurrency: 40
      timeoutSeconds: 30
      serviceAccountName: illinicover-web@PROJECT_ID_REQUIRED.iam.gserviceaccount.com
      containers:
        - image: REGION_REQUIRED-docker.pkg.dev/PROJECT_ID_REQUIRED/REPOSITORY_REQUIRED/backend@sha256:IMAGE_DIGEST_REQUIRED
          ports:
            - name: http1
              containerPort: 8080
          env:
            - name: DJANGO_SETTINGS_MODULE
              value: config.settings.production
            - name: DEPLOYMENT_ENVIRONMENT
              value: production
            - name: DATABASE_MODE
              value: pooled
            - name: CODE_REVISION
              value: COMMIT_SHA_REQUIRED
            - name: PUBLIC_API_ORIGIN
              value: PRODUCTION_API_ORIGIN_REQUIRED
            - name: TRUSTED_XFF_PROXY_HOPS
              value: "0"
            - name: ALLOWED_HOSTS
              value: .run.app,api.illinicover.com,localhost,127.0.0.1
            - name: CSRF_TRUSTED_ORIGINS
              value: https://*.run.app,https://api.illinicover.com
            - name: ILLINICOVER_SECRETS_JSON
              valueFrom:
                secretKeyRef:
                  name: illinicover-web
                  key: SECRET_VERSION_REQUIRED
          resources:
            limits:
              cpu: "1"
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 2
            timeoutSeconds: 1
            failureThreshold: 15
          livenessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/live
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
            successThreshold: 1
