name: IlliniCover

options:
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "18.0"
  developmentLanguage: en
  xcodeVersion: "16.0"

configs:
  Local: debug
  Preview: debug
  Production: release

packages:
  GRDB:
    url: https://github.com/groue/GRDB.swift.git
    exactVersion: 7.11.1
  OpenAPIGenerator:
    url: https://github.com/apple/swift-openapi-generator.git
    exactVersion: 1.13.0
  OpenAPIRuntime:
    url: https://github.com/apple/swift-openapi-runtime.git
    exactVersion: 1.12.0
  OpenAPIURLSession:
    url: https://github.com/apple/swift-openapi-urlsession.git
    exactVersion: 1.3.1
  RevenueCat:
    url: https://github.com/RevenueCat/purchases-ios.git
    exactVersion: 5.83.1
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    exactVersion: 8.58.4

settings:
  base:
    CLANG_ENABLE_MODULES: YES
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: Y74N5FFSEJ
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    GENERATE_INFOPLIST_FILE: NO
    IPHONEOS_DEPLOYMENT_TARGET: 18.0
    MARKETING_VERSION: 2.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 6.0
    SWIFT_STRICT_CONCURRENCY: complete
    TARGETED_DEVICE_FAMILY: "1"

targets:
  IlliniCover:
    type: application
    platform: iOS
    sources:
      - path: IlliniCover
      - path: ../api/fixtures
        type: folder
        buildPhase: resources
    configFiles:
      Local: Config/Local.xcconfig
      Preview: Config/Preview.xcconfig
      Production: Config/Production.xcconfig
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    preBuildScripts:
      - name: Validate environment boundary
        script: /bin/sh "$SRCROOT/scripts/validate-build-settings.sh"
        inputFiles:
          - $(SRCROOT)/scripts/validate-build-settings.sh
        basedOnDependencyAnalysis: false
    dependencies:
      - package: GRDB
        product: GRDB
      - package: OpenAPIRuntime
        product: OpenAPIRuntime
      - package: OpenAPIURLSession
        product: OpenAPIURLSession
      - package: RevenueCat
        product: RevenueCat
      - package: Sentry
        product: Sentry
  IlliniCoverTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: IlliniCoverTests
    dependencies:
      - target: IlliniCover
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/IlliniCover.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/IlliniCover
        BUNDLE_LOADER: $(TEST_HOST)
      configs:
        Local:
          PRODUCT_BUNDLE_IDENTIFIER: com.illinicover.app.dev.tests
        Preview:
          PRODUCT_BUNDLE_IDENTIFIER: com.illinicover.app.dev.tests
        Production:
          PRODUCT_BUNDLE_IDENTIFIER: com.illinicover.app.tests

  IlliniCoverUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: IlliniCoverUITests
    dependencies:
      - target: IlliniCover
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: IlliniCover
      configs:
        Local:
          PRODUCT_BUNDLE_IDENTIFIER: com.illinicover.app.dev.uitests
        Preview:
          PRODUCT_BUNDLE_IDENTIFIER: com.illinicover.app.dev.uitests
        Production:
          PRODUCT_BUNDLE_IDENTIFIER: com.illinicover.app.uitests

schemes:
  IlliniCover Local:
    build:
      targets:
        IlliniCover: all
        IlliniCoverTests: [test]
        IlliniCoverUITests: [test]
    run:
      config: Local
    test:
      config: Local
      gatherCoverageData: true
      testPlans:
        - path: TestPlans/Fast.xctestplan
          defaultPlan: true
        - path: TestPlans/UI.xctestplan
        - path: TestPlans/Integration.xctestplan
    archive:
      config: Local
  IlliniCover Preview:
    build:
      targets:
        IlliniCover: all
        IlliniCoverTests: [test]
        IlliniCoverUITests: [test]
    run:
      config: Preview
    test:
      config: Preview
      gatherCoverageData: true
      testPlans:
        - path: TestPlans/UI.xctestplan
          defaultPlan: true
        - path: TestPlans/Integration.xctestplan
    archive:
      config: Preview
  IlliniCover:
    build:
      targets:
        IlliniCover: all
        IlliniCoverTests: [test]
        IlliniCoverUITests: [test]
    run:
      config: Production
    test:
      config: Local
      gatherCoverageData: true
      testPlans:
        - path: TestPlans/Fast.xctestplan
          defaultPlan: true
    archive:
      config: Production
