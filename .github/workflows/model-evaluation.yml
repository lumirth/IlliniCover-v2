name: Model evaluation

on:
  pull_request:
    branches: [main]
    paths:
      - data/**
      - server/covers/modeling/**
      - server/covers/releases.py
      - scripts/data/**
      - tests/data/**
  schedule:
    - cron: "41 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: model-evaluation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evaluate:
    name: Model / complete historical evaluation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.8.5
          install_args: python uv
          experimental: true
      - run: uv sync --frozen
      - name: Run deterministic data checks and full evaluation
        env:
          CODE_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          scripts/ci/data.sh
          mise run model:evaluate
          uv run python - <<'PY'
          import json
          from pathlib import Path

          receipt = json.loads(Path(".artifacts/model/evaluation.json").read_text())
          expected = "6f2ab9fa650e095b46798837a0c51aaf0ffed3a7a9b7e466648786980525cc72"
          if receipt["evaluation_receipt_sha256"] != expected:
              raise SystemExit("full historical evaluation drifted from the reviewed release receipt")
          PY
      - name: Retain model evaluation receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: model-evaluation-${{ github.run_id }}
          path: .artifacts/model/evaluation.json
          if-no-files-found: warn
          retention-days: 14
