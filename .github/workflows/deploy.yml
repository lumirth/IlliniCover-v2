name: Deploy production

on:
  push:
    branches: [main]
    paths:
      - .dockerignore
      - .github/workflows/deploy.yml
      - .gcloudignore
      - api/**
      - data/**
      - docs/privacy-policy.md
      - ops/**
      - pyproject.toml
      - server/**
      - uv.lock
  workflow_dispatch:
    inputs:
      prealpha_cutover:
        description: Use only after both database bundles point at one fresh database
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Production / prepare and promote
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: production
    env:
      ARTIFACT_REPOSITORY: ${{ vars.GCP_ARTIFACT_REPOSITORY }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      PUBLIC_API_ORIGIN: ${{ vars.PRODUCTION_API_ORIGIN }}
      WIF_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}
      WIF_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
      ALLOWED_HOSTS: 127.0.0.1,localhost
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/illinicover_ci
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@127.0.0.1:5432/illinicover_ci
      DJANGO_SECRET_KEY: ci-only-not-a-deployed-secret
      DJANGO_SETTINGS_MODULE: config.settings.ci
      PREALPHA_CUTOVER: ${{ inputs.prealpha_cutover && 'true' || 'false' }}
    services:
      postgres:
        image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
        env:
          POSTGRES_DB: illinicover_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d illinicover_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.8.5
          install_args: python uv actionlint
          experimental: true
      - run: uv sync --frozen
      - name: Verify the exact revision before deployment
        run: scripts/ci/check.sh
      - name: Validate the production boundary
        run: |
          set -euo pipefail
          for name in GCP_PROJECT_ID GCP_REGION ARTIFACT_REPOSITORY PUBLIC_API_ORIGIN WIF_PROVIDER WIF_DEPLOY_SERVICE_ACCOUNT; do
            [[ -n "${!name:-}" && "${!name}" != *REQUIRED* ]] || {
              echo "Required production variable $name is missing." >&2
              exit 2
            }
          done
          [[ "$GCP_PROJECT_ID" != lukashermes ]]
          [[ "$PUBLIC_API_ORIGIN" =~ ^https://[A-Za-z0-9.-]+(:[0-9]+)?$ ]]
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          version: 580.0.0
      - name: Build and resolve the immutable image
        run: |
          set -euo pipefail
          repository="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/${ARTIFACT_REPOSITORY}/backend"
          gcloud artifacts repositories set-cleanup-policies "$ARTIFACT_REPOSITORY" \
            --project "$GCP_PROJECT_ID" --location "$GCP_REGION" \
            --policy ops/deployment/artifact-cleanup-policy.json --no-dry-run --quiet
          gcloud builds submit \
            --project "$GCP_PROJECT_ID" --region "$GCP_REGION" \
            --config ops/container/cloudbuild.yaml \
            --substitutions "_IMAGE=${repository}:${GITHUB_SHA},_CODE_REVISION=${GITHUB_SHA}" \
            --quiet .
          digest="$(gcloud artifacts docker images describe "${repository}:${GITHUB_SHA}" \
            --project "$GCP_PROJECT_ID" --format='value(image_summary.digest)')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || {
            echo "Cloud Build did not produce an exact image digest." >&2
            exit 3
          }
          echo "IMAGE=${repository}@${digest}" >> "$GITHUB_ENV"
      - name: Prepare, probe, and promote
        env:
          CODE_REVISION: ${{ github.sha }}
        run: ops/deployment/deploy-cloud-run.sh
      - name: Record the provider identities
        run: |
          {
            echo '### Production release'
            echo
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Image: \`${IMAGE}\`"
            echo "- Origin: \`${PUBLIC_API_ORIGIN}\`"
            echo '- Preparation completed before candidate traffic; web and scheduled reconciliation readbacks passed.'
          } >> "$GITHUB_STEP_SUMMARY"
