name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    name: Change classification
    runs-on: ubuntu-24.04
    outputs:
      backend: ${{ steps.paths.outputs.backend }}
      migrations: ${{ steps.paths.outputs.migrations }}
      contract: ${{ steps.paths.outputs.contract }}
      fixtures: ${{ steps.paths.outputs.fixtures }}
      data: ${{ steps.paths.outputs.data }}
      ops: ${{ steps.paths.outputs.ops }}
      ios: ${{ steps.paths.outputs.ios }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - id: paths
        name: Classify changed seams
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only --diff-filter=ACDMRT "$BASE_SHA" "$HEAD_SHA" \
            | python3 scripts/ci/classify_changes.py --github-output "$GITHUB_OUTPUT"

  backend:
    name: Backend / PostgreSQL
    needs: classify
    if: needs.classify.outputs.backend == 'true' || needs.classify.outputs.migrations == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
        env:
          POSTGRES_DB: illinicover_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d illinicover_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      ALLOWED_HOSTS: 127.0.0.1,localhost
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/illinicover_ci
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@127.0.0.1:5432/illinicover_ci
      DJANGO_SECRET_KEY: ci-only-not-a-deployed-secret
      DJANGO_SETTINGS_MODULE: config.settings.ci
      PUBLIC_API_ORIGIN: http://127.0.0.1:8000
      ALLOW_RISKY_MIGRATIONS: ${{ contains(github.event.pull_request.labels.*.name, 'destructive-migration-reviewed') }}
      DESTRUCTIVE_MIGRATION_PR_BODY: ${{ github.event.pull_request.body }}
      MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: 2026.8.5
          install_args: python uv
          experimental: true
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Capture changed migrations
        if: needs.classify.outputs.migrations == 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          {
            echo 'CHANGED_MIGRATIONS<<ILLINICOVER_MIGRATIONS'
            git diff --name-only --diff-filter=ACDMRT "$BASE_SHA" "$HEAD_SHA" -- 'server/**/migrations/*.py'
            echo 'ILLINICOVER_MIGRATIONS'
          } >> "$GITHUB_ENV"
      - id: migration-risk
        name: Classify changed migration operations
        if: needs.classify.outputs.migrations == 'true'
        run: |
          mapfile -t migration_paths < <(printf '%s\n' "$CHANGED_MIGRATIONS" | sed '/^$/d')
          set +e
          python3 scripts/ci/classify_migrations.py \
            --repository . \
            --base "$MIGRATION_BASE_SHA" \
            "${migration_paths[@]}"
          status=$?
          set -e
          case "$status" in
            0) echo 'risky=false' >> "$GITHUB_OUTPUT" ;;
            10) echo 'risky=true' >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - name: Run atomic backend gates
        run: |
          mkdir -p .artifacts/ci/backend
          {
            mise run lint:server
            mise run typecheck:server
            mise run check:migrations
            uv run python server/manage.py migrate --noinput --settings=config.settings.ci
            uv run pytest -q server
          } 2>&1 | tee .artifacts/ci/backend/backend.log
      - name: Bind exceptional migration to exact preview and restore receipts
        if: steps.migration-risk.outputs.risky == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          runs="$RUNNER_TEMP/destructive-migration-preview-runs.json"
          gh api --method GET \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/preview.yml/runs" \
            -f event=pull_request -f status=success -f head_sha="$PR_HEAD_SHA" -f per_page=100 \
            > "$runs"
          python3 scripts/ci/migration_evidence.py release \
            --pulls "$GITHUB_EVENT_PATH" \
            --runs "$runs" \
            --expected-head-sha "$PR_HEAD_SHA" \
            --expected-pr-number "$PR_NUMBER" \
            --allow-unmerged \
            --github-summary "$GITHUB_STEP_SUMMARY"
      - name: Retain backend failure receipt
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-failure-${{ github.run_id }}
          path: .artifacts/ci/backend
          if-no-files-found: ignore
          retention-days: 7

  migration-fresh:
    name: Migrations / fresh PostgreSQL
    needs: classify
    if: needs.classify.outputs.migrations == 'true'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
        env:
          POSTGRES_DB: illinicover_migrations
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d illinicover_migrations"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/illinicover_migrations
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@127.0.0.1:5432/illinicover_migrations
      DJANGO_SECRET_KEY: ci-only-not-a-deployed-secret
      DJANGO_SETTINGS_MODULE: config.settings.ci
      PUBLIC_API_ORIGIN: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: 2026.8.5
          install_args: python uv
          experimental: true
      - run: uv sync --frozen
      - name: Apply the complete migration chain to a clean PostgreSQL database
        run: |
          mkdir -p .artifacts/ci/migrations
          uv run python server/manage.py migrate --noinput --settings=config.settings.ci \
            2>&1 | tee .artifacts/ci/migrations/fresh.log
          uv run python server/manage.py migrate --check --plan --settings=config.settings.ci \
            2>&1 | tee .artifacts/ci/migrations/compatibility.log
      - name: Retain migration failure receipt
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: migration-failure-${{ github.run_id }}
          path: .artifacts/ci/migrations
          if-no-files-found: ignore
          retention-days: 7

  contract:
    name: API contract
    needs: classify
    if: needs.classify.outputs.contract == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: 2026.8.5
          install_args: python uv
          experimental: true
      - run: uv sync --frozen
      - name: Verify generated OpenAPI
        run: |
          mkdir -p .artifacts/ci/contract
          scripts/ci/contract.sh 2>&1 | tee .artifacts/ci/contract/openapi.diff
      - name: Retain contract failure receipt
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contract-failure-${{ github.run_id }}
          path: .artifacts/ci/contract
          if-no-files-found: ignore
          retention-days: 7

  fixtures:
    name: Canonical fixtures
    needs: classify
    if: needs.classify.outputs.fixtures == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: 2026.8.5
          install_args: python uv
          experimental: true
      - run: uv sync --frozen
      - name: Verify generated fixtures
        run: |
          mkdir -p .artifacts/ci/fixtures
          scripts/ci/fixtures.sh --check 2>&1 | tee .artifacts/ci/fixtures/fixtures.diff
      - name: Retain fixture failure receipt
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: fixtures-failure-${{ github.run_id }}
          path: .artifacts/ci/fixtures
          if-no-files-found: ignore
          retention-days: 7

  data:
    name: Model and data
    needs: classify
    if: needs.classify.outputs.data == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: 2026.8.5
          install_args: python uv
          experimental: true
      - run: uv sync --frozen
      - name: Validate model inputs
        run: |
          mkdir -p .artifacts/ci/data
          scripts/ci/data.sh 2>&1 | tee .artifacts/ci/data/data.log
      - name: Retain data failure receipt
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: data-failure-${{ github.run_id }}
          path: .artifacts/ci/data
          if-no-files-found: ignore
          retention-days: 7

  ops:
    name: Operations configuration
    needs: classify
    if: needs.classify.outputs.ops == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3.6.3
        with:
          version: 2026.8.5
          install_args: python uv actionlint
          experimental: true
      - run: uv sync --frozen
      - name: Validate repository operations configuration
        run: |
          mkdir -p .artifacts/ci/ops
          scripts/ci/ops.sh 2>&1 | tee .artifacts/ci/ops/ops.log
      - name: Retain operations failure receipt
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ops-failure-${{ github.run_id }}
          path: .artifacts/ci/ops
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: CI / Required
    if: always()
    needs: [classify, backend, migration-fresh, contract, fixtures, data, ops]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every selected seam to pass
        env:
          RESULTS: >-
            ${{ join(needs.*.result, ',') }}
        run: |
          case ",$RESULTS," in
            *,failure,*|*,cancelled,*)
              echo "At least one selected CI seam failed or was cancelled: $RESULTS" >&2
              exit 1
              ;;
          esac
          echo "Selected CI seams passed; skipped seams were unrelated."
