name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: Server / PostgreSQL
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
        env:
          POSTGRES_DB: illinicover_ci
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres -d illinicover_ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      ALLOWED_HOSTS: 127.0.0.1,localhost
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/illinicover_ci
      DATABASE_URL_DIRECT: postgresql://postgres:postgres@127.0.0.1:5432/illinicover_ci
      DJANGO_SECRET_KEY: ci-only-not-a-deployed-secret
      DJANGO_SETTINGS_MODULE: config.settings.ci
      PUBLIC_API_ORIGIN: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: 2026.8.5
          install_args: python uv actionlint
          experimental: true
      - run: uv sync --frozen
      - name: Check the application as one deployable system
        run: scripts/ci/check.sh
